# Production overrides — use with:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: "3.9"

services:
  api:
    restart: always
    environment:
      DEBUG: "False"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  celery_worker:
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery_beat:
    restart: always

  frontend:
    restart: always
    environment:
      NODE_ENV: production

  nginx:
    restart: always

  fl_server:
    restart: on-failure

  db:
    restart: always
    volumes:
      - fahin_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
