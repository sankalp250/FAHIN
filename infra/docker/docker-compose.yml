version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: fahin_db
    environment:
      POSTGRES_DB: fahin
      POSTGRES_USER: fahin_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fahin_secret}
    volumes:
      - fahin_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahin_user -d fahin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache / Queue ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fahin_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: fahin_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fahin_user:${DB_PASSWORD:-fahin_secret}@db:5432/fahin
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ../../ml/models:/app/ml_models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: fahin_celery
    depends_on:
      - api
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://fahin_user:${DB_PASSWORD:-fahin_secret}@db:5432/fahin
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../../ml/models:/app/ml_models:ro
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  celery_beat:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: fahin_beat
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
    command: celery -A app.core.celery_app beat --loglevel=info

  # ── Flower FL Server ────────────────────────────────────────────────────────
  fl_server:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: fahin_fl
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql+asyncpg://fahin_user:${DB_PASSWORD:-fahin_secret}@db:5432/fahin
    ports:
      - "8080:8080"
    volumes:
      - fahin_fl_weights:/app/fl_weights
    command: python app/services/federated/fl_server.py --rounds 20 --min_clients 2

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: fahin_frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
    ports:
      - "3000:3000"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fahin_nginx
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - fahin_ssl:/etc/ssl/fahin

volumes:
  fahin_pgdata:
  fahin_fl_weights:
  fahin_ssl:
