apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahin-frontend
  namespace: fahin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fahin-frontend
  template:
    metadata:
      labels:
        app: fahin-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/your-org/fahin-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://fahin.yourdomain.com/api/v1"
        envFrom:
        - secretRef:
            name: fahin-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fahin-frontend-svc
  namespace: fahin
spec:
  selector:
    app: fahin-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
