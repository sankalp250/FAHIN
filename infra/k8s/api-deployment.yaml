apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahin-api
  namespace: fahin
  labels:
    app: fahin-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fahin-api
  template:
    metadata:
      labels:
        app: fahin-api
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/fahin-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: fahin-secrets
        - configMapRef:
            name: fahin-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fahin-api-svc
  namespace: fahin
spec:
  selector:
    app: fahin-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fahin-api-hpa
  namespace: fahin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fahin-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
