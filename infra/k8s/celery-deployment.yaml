apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahin-celery
  namespace: fahin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fahin-celery
  template:
    metadata:
      labels:
        app: fahin-celery
    spec:
      containers:
      - name: celery-worker
        image: ghcr.io/your-org/fahin-api:latest
        command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
        envFrom:
        - secretRef:
            name: fahin-secrets
        - configMapRef:
            name: fahin-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahin-celery-beat
  namespace: fahin
spec:
  replicas: 1  # Beat must be singleton
  selector:
    matchLabels:
      app: fahin-celery-beat
  template:
    metadata:
      labels:
        app: fahin-celery-beat
    spec:
      containers:
      - name: celery-beat
        image: ghcr.io/your-org/fahin-api:latest
        command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
        envFrom:
        - secretRef:
            name: fahin-secrets
        - configMapRef:
            name: fahin-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
