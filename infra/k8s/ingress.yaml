apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fahin-ingress
  namespace: fahin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fahin.yourdomain.com
    secretName: fahin-tls
  rules:
  - host: fahin.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fahin-api-svc
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fahin-frontend-svc
            port:
              number: 3000
